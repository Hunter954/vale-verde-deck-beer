{% extends "base.html" %}
{% block content %}
<section class="tables-page">
  <div class="tables-head">
    <div>
      <h1>Mesas</h1>
      <p>Interface first-mobile para atendimento no salão.</p>
    </div>
    <form method="post" action="{{ url_for('tables.create_table') }}">
      <button class="btn-new-table" type="submit"><i class="bi bi-plus-lg"></i> Nova Mesa</button>
    </form>
  </div>

  <div class="tables-grid tables-grid-operational">
    {% for t in table_cards %}
    <a class="table-card table-card-operational status-{{ t.status_class }}" href="{{ t.href }}">
      <div class="table-card-top">
        <small>Mesa</small>
        <strong>{{ "%02d"|format(t.number) }}</strong>
      </div>
      <span class="table-status-pill">{{ t.status }}</span>
      <div class="table-card-info">
        <b>{{ t.main }}</b>{% if t.meta %}<span>{{ t.meta }}</span>{% endif %}
      </div>
      <small class="table-card-footer">{{ t.footer }}</small>
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
