{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>{{ "Editar" if product else "Novo" }} produto</h1><p>Configure preço, estoque, setor e alertas.</p></div></div>
<form method="post" enctype="multipart/form-data" class="glass-card">
<div class="row g-3">
  <div class="col-md-6"><label>Nome</label><input class="form-control" name="name" required value="{{ product.name if product else '' }}"></div>
  <div class="col-md-3"><label>Categoria</label><select class="form-select" name="category_id"><option value="">Selecione</option>{% for c in categories %}<option value="{{ c.id }}" {% if product and product.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
  <div class="col-md-3"><label>Setor preparo</label><select class="form-select" name="sector_id"><option value="">Selecione</option>{% for s in sectors %}<option value="{{ s.id }}" {% if product and product.sector_id==s.id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></div>
  <div class="col-md-3"><label>Preço venda</label><input class="form-control" type="number" step="0.01" name="price" value="{{ product.price if product else 0 }}"></div>
  <div class="col-md-3"><label>Custo</label><input class="form-control" type="number" step="0.01" name="cost" value="{{ product.cost if product else 0 }}"></div>
  <div class="col-md-3"><label>Estoque</label><input class="form-control" type="number" step="0.001" name="stock" value="{{ product.stock if product else 0 }}"></div>
  <div class="col-md-3"><label>Estoque mínimo</label><input class="form-control" type="number" step="0.001" name="min_stock" value="{{ product.min_stock if product else 0 }}"></div>
  <div class="col-md-3"><label>Código interno</label><input class="form-control" name="internal_code" value="{{ product.internal_code if product else '' }}"></div>
  <div class="col-md-3"><label>Código barras</label><input class="form-control" name="barcode" value="{{ product.barcode if product else '' }}"></div>
  <div class="col-md-3"><label>Tempo preparo min</label><input class="form-control" type="number" name="avg_prep_minutes" value="{{ product.avg_prep_minutes if product else 0 }}"></div>
  <div class="col-md-3"><label>Imagem</label><input class="form-control" type="file" name="image"></div>
  <div class="col-12"><label>Obs. preparo</label><textarea class="form-control" name="prep_note">{{ product.prep_note if product else '' }}</textarea></div>
  <div class="col-12 d-flex gap-4 flex-wrap">
    <label><input type="checkbox" name="active" {% if not product or product.active %}checked{% endif %}> Ativo</label>
    <label><input type="checkbox" name="controlled" {% if product and product.controlled %}checked{% endif %}> Produto controlado</label>
    <label><input type="checkbox" name="adult_warning" {% if product and product.adult_warning %}checked{% endif %}> Aviso maioridade</label>
  </div>
</div>
<button class="btn btn-neon mt-4">Salvar produto</button>
</form>
{% endblock %}
