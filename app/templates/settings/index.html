{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1>Configurações</h1><p>Funcionários, perfis e ajustes gerais.</p></div></div>
<div class="row g-3"><div class="col-lg-4"><div class="glass-card"><h4>Novo funcionário</h4><form method="post" action="{{ url_for('settings.create_user') }}">
<input class="form-control mb-2" name="name" placeholder="Nome" required><input class="form-control mb-2" name="email" type="email" placeholder="Email" required><input class="form-control mb-2" name="phone" placeholder="Telefone"><input class="form-control mb-2" name="password" placeholder="Senha inicial">
<select class="form-select mb-2" name="role_id">{% for r in roles %}<option value="{{ r.id }}">{{ r.name }}</option>{% endfor %}</select><button class="btn btn-neon w-100">Criar</button></form></div></div>
<div class="col-lg-8"><div class="glass-card table-responsive"><h4>Funcionários</h4><table class="table table-dark">{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.role.name if u.role else "-" }}</td><td>{{ "Ativo" if u.active else "Inativo" }}</td></tr>{% endfor %}</table></div></div></div>
{% endblock %}
